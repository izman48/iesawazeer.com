<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">How health.nilu.app is put together</title>
  <desc id="d">I chat with Claude, which calls the MCP server over HTTPS. A browser loads the web app and its JSON API. Both go through Caddy into one container, where shared services write to one SQLite file.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b98a5"/>
    </marker>
    <style>
      .bg{fill:#0b0f14}
      .box{fill:#131a22;stroke:#2a3642;stroke-width:1.5}
      .me{fill:#10231a;stroke:#2f7d57;stroke-width:1.5}
      .zone{fill:none;stroke:#2a3642;stroke-width:1.5;stroke-dasharray:6 6}
      .db{fill:#0f2036;stroke:#3b82d6;stroke-width:1.5}
      .t{fill:#e6edf3;font-size:16px;font-weight:600;text-anchor:middle}
      .s{fill:#8b98a5;font-size:13px;text-anchor:middle}
      .l{fill:#8b98a5;font-size:13px}
      .z{fill:#8b98a5;font-size:13px;font-weight:600;letter-spacing:.04em}
      .w{stroke:#8b98a5;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <rect class="bg" width="760" height="600" rx="12"/>

  <rect class="me" x="30" y="30" width="150" height="60" rx="10"/>
  <text class="t" x="105" y="56">Me</text>
  <text class="s" x="105" y="76">"I had a wrap"</text>

  <rect class="box" x="260" y="30" width="180" height="60" rx="10"/>
  <text class="t" x="350" y="56">Claude</text>
  <text class="s" x="350" y="76">estimates and calls tools</text>

  <rect class="me" x="520" y="30" width="180" height="60" rx="10"/>
  <text class="t" x="610" y="56">Me, in a browser</text>
  <text class="s" x="610" y="76">graphs and history</text>

  <path class="w" d="M180 60H258" marker-end="url(#a)"/>
  <text class="l" x="219" y="50" text-anchor="middle">chat</text>

  <path class="w" d="M350 90V148" marker-end="url(#a)"/>
  <text class="l" x="340" y="116" text-anchor="end">MCP over HTTPS</text>
  <text class="l" x="340" y="133" text-anchor="end">OAuth token</text>
  <path class="w" d="M610 90V148" marker-end="url(#a)"/>
  <text class="l" x="620" y="116">HTTPS</text>
  <text class="l" x="620" y="133">session cookie</text>

  <rect class="box" x="260" y="150" width="440" height="40" rx="10"/>
  <text class="t" x="480" y="176">Caddy (TLS)</text>

  <rect class="zone" x="230" y="225" width="500" height="350" rx="12"/>
  <text class="z" x="246" y="562">ONE CONTAINER, ONE FASTAPI PROCESS</text>

  <path class="w" d="M350 190V263" marker-end="url(#a)"/>
  <path class="w" d="M610 190V263" marker-end="url(#a)"/>

  <rect class="box" x="260" y="265" width="180" height="60" rx="10"/>
  <text class="t" x="350" y="291">MCP server at /mcp</text>
  <text class="s" x="350" y="311">11 tools</text>

  <rect class="box" x="520" y="265" width="180" height="60" rx="10"/>
  <text class="t" x="610" y="291">Web app and /api</text>
  <text class="s" x="610" y="311">React build, JSON routes</text>

  <path class="w" d="M350 325V368" marker-end="url(#a)"/>
  <path class="w" d="M610 325V368" marker-end="url(#a)"/>

  <rect class="box" x="260" y="370" width="440" height="60" rx="10"/>
  <text class="t" x="480" y="396">Services</text>
  <text class="s" x="480" y="416">rules, idempotency keys, audit log, undo, weight model</text>

  <path class="w" d="M480 430V473" marker-end="url(#a)"/>

  <rect class="db" x="380" y="475" width="200" height="60" rx="10"/>
  <text class="t" x="480" y="501">SQLite (WAL)</text>
  <text class="s" x="480" y="521">one file, nightly backups</text>
</svg>
